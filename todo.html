<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100e">
  <title>Terra Tasks</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100e;
      --panel: #0d1914;
      --panel-raised: #12221a;
      --line: #294036;
      --text: #e8f1eb;
      --muted: #91a49a;
      --green: #c8f27b;
      --mint: #5ee0ae;
      --danger: #ff8a80;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 18px;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 0%, #14291d 0, var(--bg) 58%);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { width: min(100%, 620px); margin: 0 auto; }
    header { margin-bottom: 24px; }
    .eyebrow { color: var(--mint); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 9px 0 6px; font-size: clamp(30px, 6vw, 42px); letter-spacing: -.05em; }
    .intro { margin: 0; color: var(--muted); line-height: 1.55; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: 0 20px 70px #0005; }
    .add-form { display: flex; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
    .add-form input { min-width: 0; flex: 1; padding: 12px 13px; border: 1px solid var(--line); border-radius: 8px; outline: none; color: var(--text); background: #07110d; }
    .add-form input:focus { border-color: var(--green); box-shadow: 0 0 0 3px #c8f27b20; }
    .primary { padding: 0 17px; border: 0; border-radius: 8px; color: #17200f; background: var(--green); font-weight: 700; }
    .primary:hover { filter: brightness(1.07); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 5px; }
    .filter, .clear-button { padding: 7px 10px; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; font-size: 13px; }
    .filter[aria-pressed="true"] { border-color: #50683e; color: var(--green); background: #1b2b1d; }
    .filter:hover, .clear-button:hover { color: var(--text); }
    .clear-button { color: var(--danger); }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .task-list { min-height: 120px; margin: 0; padding: 0; list-style: none; }
    .task { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 16px; border-bottom: 1px solid #20332a; }
    .task:last-child { border-bottom: 0; }
    .task input[type="checkbox"] { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--mint); cursor: pointer; }
    .task-text { flex: 1; overflow-wrap: anywhere; line-height: 1.45; }
    .task.completed .task-text { color: #72867a; text-decoration: line-through; }
    .delete-button { width: 34px; height: 34px; border: 0; border-radius: 7px; color: #91a49a; background: transparent; font-size: 20px; }
    .delete-button:hover { color: var(--danger); background: #ff8a8014; }
    .empty { padding: 34px 16px; color: var(--muted); text-align: center; }
    .storage-note { margin: 14px 2px 0; color: #71847a; font-size: 12px; line-height: 1.5; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 420px) { body { padding: 26px 12px; } .add-form { padding: 12px; } .toolbar { padding: 10px 12px; } .task { padding-inline: 12px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">A small, local planner</div>
      <h1>My tasks</h1>
      <p class="intro">Add a task, check it off, and pick up where you left off. Your list stays in this browser.</p>
    </header>

    <section class="card" aria-label="To-do list">
      <form class="add-form" id="taskForm">
        <label class="sr-only" for="taskInput">New task</label>
        <input id="taskInput" name="task" maxlength="240" placeholder="What needs to get done?" autocomplete="off" required>
        <button class="primary" type="submit">Add task</button>
      </form>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <span class="count" id="taskCount" aria-live="polite">0 tasks left</span>
        <button class="clear-button" id="clearCompleted" type="button">Clear completed</button>
      </div>
      <ul class="task-list" id="taskList" aria-label="Tasks"></ul>
      <div class="empty" id="emptyState">No tasks yet. Add one above to get started.</div>
    </section>
    <p class="storage-note">Tasks are saved using this browser’s local storage and aren’t synced to other devices.</p>
  </main>

  <script>
    const STORAGE_KEY = 'terra-tasks-v1';
    const taskForm = document.querySelector('#taskForm');
    const taskInput = document.querySelector('#taskInput');
    const taskList = document.querySelector('#taskList');
    const taskCount = document.querySelector('#taskCount');
    const emptyState = document.querySelector('#emptyState');
    const clearCompletedButton = document.querySelector('#clearCompleted');
    const filterButtons = [...document.querySelectorAll('[data-filter]')];
    let filter = 'all';
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(stored)) return [];
        return stored.filter(task => task && typeof task.id === 'string' && typeof task.text === 'string')
          .map(task => ({ id: task.id, text: task.text, completed: Boolean(task.completed) }));
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch {
        document.querySelector('.storage-note').textContent = 'Could not save tasks in this browser. Check its local storage settings.';
      }
    }

    function render() {
      const visibleTasks = tasks.filter(task => filter === 'all' || (filter === 'active' ? !task.completed : task.completed));
      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = `${remaining} ${remaining === 1 ? 'task' : 'tasks'} left`;
      taskList.replaceChildren();
      emptyState.hidden = visibleTasks.length > 0;
      emptyState.textContent = tasks.length === 0
        ? 'No tasks yet. Add one above to get started.'
        : `No ${filter === 'active' ? 'active' : 'completed'} tasks.`;
      clearCompletedButton.disabled = !tasks.some(task => task.completed);
      clearCompletedButton.style.opacity = clearCompletedButton.disabled ? '.45' : '1';

      for (const task of visibleTasks) {
        const row = document.createElement('li');
        row.className = `task${task.completed ? ' completed' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.setAttribute('aria-label', `${task.completed ? 'Mark active' : 'Complete'}: ${task.text}`);
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const remove = document.createElement('button');
        remove.className = 'delete-button';
        remove.type = 'button';
        remove.textContent = '×';
        remove.setAttribute('aria-label', `Delete task: ${task.text}`);
        remove.addEventListener('click', () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        row.append(checkbox, text, remove);
        taskList.append(row);
      }
    }

    taskForm.addEventListener('submit', event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.unshift({ id: crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`, text, completed: false });
      saveTasks();
      taskInput.value = '';
      filter = 'all';
      filterButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === filter)));
      render();
      taskInput.focus();
    });

    filterButtons.forEach(button => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      filterButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    }));

    clearCompletedButton.addEventListener('click', () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
